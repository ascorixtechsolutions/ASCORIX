<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Details | ASCORIX TECH SOLUTIONS</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #070b16;
      --bg-secondary: #0c1224;
      --accent-cyan: #06b6d4;
      --accent-violet: #8b5cf6;
      --color-text-primary: #ffffff;
      --color-text-secondary: #94a3b8;
      --color-text-muted: #64748b;
      --glass-bg: rgba(12, 18, 36, 0.7);
      --glass-border: rgba(255, 255, 255, 0.06);
      --gradient-primary: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      color: var(--color-text-primary);
      line-height: 1.6;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.05) 0%, transparent 40%);
      background-attachment: fixed;
    }

    .header {
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(7, 11, 22, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: white;
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
    }

    .logo span {
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .container {
      max-width: 1100px;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--color-text-secondary);
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 2rem;
      transition: color 0.3s;
    }

    .back-link:hover {
      color: var(--accent-cyan);
    }

    .main-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .hero-banner {
      width: 100%;
      height: 380px;
      position: relative;
      overflow: hidden;
    }

    .hero-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(12, 18, 36, 0.2) 0%, rgba(12, 18, 36, 0.95) 100%);
    }

    .hero-content {
      position: absolute;
      bottom: 2.5rem;
      left: 2.5rem;
      right: 2.5rem;
    }

    .category-badge {
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.3);
      color: var(--accent-cyan);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.35rem 1rem;
      border-radius: 50px;
      letter-spacing: 0.05em;
      display: inline-block;
      margin-bottom: 0.75rem;
    }

    .project-title {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1.7fr 1.3fr;
      gap: 3.5rem;
      padding: 3rem;
    }

    @media (max-width: 868px) {
      .content-grid {
        grid-template-columns: 1fr;
        gap: 2.5rem;
        padding: 2rem;
      }
      .hero-banner {
        height: 280px;
      }
      .hero-content {
        bottom: 1.5rem;
        left: 1.5rem;
        right: 1.5rem;
      }
      .project-title {
        font-size: 1.8rem;
      }
    }

    h4 {
      font-size: 1.25rem;
      color: white;
      margin-bottom: 1rem;
      font-weight: 700;
      position: relative;
    }

    p {
      color: var(--color-text-secondary);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }

    .spec-box {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 16px;
      padding: 1.75rem;
      margin-bottom: 2rem;
    }

    .spec-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 0.95rem;
    }

    .spec-item:last-child {
      border-bottom: none;
    }

    .spec-label {
      color: var(--color-text-muted);
    }

    .spec-value {
      font-weight: 700;
      color: white;
    }

    .feature-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--color-text-secondary);
      font-size: 0.95rem;
    }

    .feature-check {
      color: var(--accent-cyan);
      font-weight: 900;
    }

    .tech-tag {
      background: rgba(6, 182, 212, 0.1);
      color: var(--accent-cyan);
      font-weight: 600;
      font-size: 0.8rem;
      padding: 0.35rem 0.85rem;
      border-radius: 6px;
      border: 1px solid rgba(6, 182, 212, 0.2);
      display: inline-block;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    .testimonial-box {
      background: radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.05) 0%, transparent 100%);
      border-left: 4px solid var(--accent-cyan);
      padding: 1.5rem;
      border-radius: 0 16px 16px 0;
      margin-top: 2rem;
    }

    .testimonial-quote {
      font-style: italic;
      color: white;
      font-size: 1rem;
      margin-bottom: 0.75rem;
    }

    .testimonial-author {
      font-weight: 700;
      color: var(--accent-cyan);
      font-size: 0.9rem;
    }

    .action-btn {
      display: block;
      width: 100%;
      padding: 0.9rem;
      border-radius: 50px;
      text-align: center;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.95rem;
      transition: all 0.3s;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--gradient-primary);
      color: white;
      border: none;
      box-shadow: 0 10px 20px rgba(6,182,212,0.25);
    }

    .btn-primary:hover {
      box-shadow: 0 12px 24px rgba(6,182,212,0.4);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--glass-border);
      color: white;
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.06);
      transform: translateY(-2px);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 2rem;
    }

    .gallery-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      cursor: pointer;
      transition: transform 0.3s;
    }

    .gallery-img:hover {
      transform: scale(1.05);
    }

    .device-mockup-section {
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.03);
      border-radius: 20px;
      padding: 2rem;
      margin-top: 3rem;
    }

    .mockup-container {
      display: flex;
      gap: 20px;
      align-items: flex-end;
      justify-content: center;
      flex-wrap: wrap;
    }

    .mockup-desktop {
      flex: 1;
      min-width: 280px;
      border: 6px solid #222;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
    }

    .mockup-mobile {
      width: 100px;
      border: 6px solid #111;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 25px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="../index.html" class="logo">
      ASCORIX <span>TECH SOLUTIONS</span>
    </a>
  </header>

  <div class="container">
    <a href="../index.html#portfolio" class="back-link">
      ← Back to Portfolio Showcase
    </a>

    <div class="main-card" id="project-card">
      <div style="padding: 4rem; text-align: center; color: var(--color-text-secondary);">
        Loading case study parameters...
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from '../db.js';

    async function loadProject() {
      const params = new URLSearchParams(window.location.search);
      const projectId = params.get('id');
      const container = document.getElementById('project-card');

      if (!projectId) {
        container.innerHTML = `<div style="padding: 4rem; text-align: center; color: var(--accent-cyan);">No project ID specified. <a href="../index.html" style="color:white">Return Home</a></div>`;
        return;
      }

      try {
        const rawData = await db.getPortfolio();
        const project = rawData.map(p => {
          let meta = {};
          try {
            meta = JSON.parse(p.description);
          } catch (e) {
            meta = {
              type: 'Demo Project',
              short_desc: p.description,
              full_desc: p.description,
              published: true,
              featured: false,
              status: 'Completed',
              industry: 'Technology',
              dev_time: '2 Weeks',
              features: ['Production-grade architecture', 'Secure credentials vaulting', 'Optimized asset delivery workflows']
            };
          }
          return { ...p, meta };
        }).find(p => (p._id === projectId || p.id === projectId));

        if (!project) {
          container.innerHTML = `<div style="padding: 4rem; text-align: center; color: var(--accent-cyan);">Project not found. <a href="../index.html" style="color:white">Return Home</a></div>`;
          return;
        }

        // Set SEO Title
        document.title = `${project.title} - Case Study | ASCORIX TECH SOLUTIONS`;

        // Render Features
        const featuresList = project.meta.features || [];
        const featuresHtml = featuresList.length > 0 
          ? featuresList.map(f => `
            <div class="feature-item">
              <span class="feature-check">✓</span> ${escapeHTML(f)}
            </div>`).join('')
          : `<p style="font-size:0.9rem; color:var(--color-text-muted)">Default deployment features integrated.</p>`;

        // Render Tech Tags
        const techTags = project.tech.map(t => `<span class="tech-tag">${escapeHTML(t)}</span>`).join('');

        // Gallery
        let galleryHtml = '';
        const allGallery = [project.image, ...(project.meta.gallery || [])].filter(Boolean);
        if (allGallery.length > 1) {
          galleryHtml = `
            <div style="margin-top: 3rem;">
              <h4>Project Gallery</h4>
              <div class="gallery-grid">
                ${allGallery.map(img => `<img src="${img}" class="gallery-img" onclick="window.open('${img}', '_blank')">`).join('')}
              </div>
            </div>
          `;
        }

        // Device screens
        let screensHtml = '';
        if (project.meta.img_desktop || project.meta.img_mobile) {
          screensHtml = `
            <div class="device-mockup-section">
              <h4 style="text-align: center; margin-bottom: 1.5rem;">Device View Layouts</h4>
              <div class="mockup-container">
                ${project.meta.img_desktop ? `
                  <div class="mockup-desktop">
                    <img src="${project.meta.img_desktop}" style="width: 100%; display: block;">
                  </div>` : ''}
                ${project.meta.img_mobile ? `
                  <div class="mockup-mobile">
                    <img src="${project.meta.img_mobile}" style="width: 100%; display: block;">
                  </div>` : ''}
              </div>
            </div>
          `;
        }

        // Testimonials
        let testimonialHtml = '';
        if ((project.meta.show_testimonial === true || project.meta.show_testimonial === 'true') && project.meta.testimonial) {
          testimonialHtml = `
            <div class="testimonial-box">
              <div class="testimonial-quote">"${escapeHTML(project.meta.testimonial)}"</div>
              <div class="testimonial-author">— ${escapeHTML(project.meta.client_name || 'Project Lead')}${project.meta.company_name ? `, ${escapeHTML(project.meta.company_name)}` : ''}</div>
            </div>
          `;
        }

        // Action Buttons
        const visitBtn = project.meta.live_url ? `<a href="${project.meta.live_url}" target="_blank" class="action-btn btn-primary">Visit Live Website</a>` : '';
        const demoBtn = project.meta.demo_url ? `<a href="${project.meta.demo_url}" target="_blank" class="action-btn btn-secondary">Launch Sandbox Demo</a>` : '';

        container.innerHTML = `
          <div class="hero-banner">
            <img src="${project.image}" alt="${escapeHTML(project.title)}">
            <div class="hero-overlay"></div>
            <div class="hero-content">
              <span class="category-badge">${escapeHTML(project.category)}</span>
              <h1 class="project-title">${escapeHTML(project.title)}</h1>
            </div>
          </div>
          
          <div class="content-grid">
            <div>
              <h4>Project Overview</h4>
              <p>${escapeHTML(project.meta.full_desc || project.description || '')}</p>
              
              ${project.meta.problem ? `
                <h4 style="margin-top: 2rem;">The Business Challenge</h4>
                <p>${escapeHTML(project.meta.problem)}</p>` : ''}
                
              ${project.meta.solution ? `
                <h4 style="margin-top: 2rem;">Solution Delivered</h4>
                <p>${escapeHTML(project.meta.solution)}</p>` : ''}

              ${screensHtml}
              ${galleryHtml}
            </div>
            
            <div>
              <div class="spec-box">
                <h4 style="font-size: 1.1rem; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 8px; margin-bottom: 8px;">Specifications</h4>
                <div class="spec-item">
                  <span class="spec-label">Industry:</span>
                  <span class="spec-value">${escapeHTML(project.meta.industry || 'Technology')}</span>
                </div>
                <div class="spec-item">
                  <span class="spec-label">Launch Date:</span>
                  <span class="spec-value">${escapeHTML(project.meta.launch_date || 'N/A')}</span>
                </div>
                <div class="spec-item">
                  <span class="spec-label">Build Time:</span>
                  <span class="spec-value">${escapeHTML(project.meta.dev_time || '2 Weeks')}</span>
                </div>
                <div class="spec-item">
                  <span class="spec-label">Deployment:</span>
                  <span class="spec-value" style="color:var(--accent-cyan)">● ${escapeHTML(project.meta.status || 'Completed')}</span>
                </div>
              </div>

              <div style="margin-bottom: 2rem;">
                <h4>Key Features Built</h4>
                ${featuresHtml}
              </div>

              <div style="margin-bottom: 2.5rem;">
                <h4>Integrated Core Stack</h4>
                <div style="margin-top: 10px;">
                  ${techTags}
                </div>
              </div>

              ${testimonialHtml}

              <div style="margin-top: 3rem;">
                ${visitBtn}
                ${demoBtn}
                <a href="../index.html#portfolio" class="action-btn btn-secondary">← Back to Showcase</a>
              </div>
            </div>
          </div>
        `;

      } catch (err) {
        container.innerHTML = `<div style="padding: 4rem; text-align: center; color: var(--accent-cyan);">Error rendering case study: ${escapeHTML(err.message)}</div>`;
      }
    }

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    loadProject();
  </script>
</body>
</html>
