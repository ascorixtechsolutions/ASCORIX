<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Definitions of Gradients -->
  <defs>
    <!-- Left Triangle Gradient (Blue to Cyan) -->
    <linearGradient id="blueCyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4"/>
      <stop offset="50%" stop-color="#4364F7"/>
      <stop offset="100%" stop-color="#00C9FF"/>
    </linearGradient>
    
    <!-- Right Triangle Gradient (Gold to Orange) -->
    <linearGradient id="goldOrangeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2994A"/>
      <stop offset="100%" stop-color="#F2C94C"/>
    </linearGradient>

    <!-- Infinity Left (Blue/Cyan) -->
    <linearGradient id="infLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052D4"/>
      <stop offset="100%" stop-color="#00C9FF"/>
    </linearGradient>
    
    <!-- Infinity Right (Green/Lime) -->
    <linearGradient id="infRightGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>

    <!-- Logo Brand Gradients for X -->
    <linearGradient id="ascorixXGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2994A"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#00C9FF"/>
    </linearGradient>
  </defs>

  <!-- Graphic Icon -->
  <g id="logo-icon" transform="translate(0, -20)">
    <!-- 1. The Upper Triangle/Arrow -->
    <!-- Left Face of Triangle -->
    <path d="M 400, 100 L 250, 350 L 400, 310 Z" fill="url(#blueCyanGrad)" />
    <!-- Right Face of Triangle -->
    <path d="M 400, 100 L 400, 310 L 550, 350 Z" fill="url(#goldOrangeGrad)" />

    <!-- 2. Inside the Triangle: Golden 4-point Star -->
    <path d="M 400, 195 Q 400, 220 375, 220 Q 400, 220 400, 245 Q 400, 220 425, 220 Q 400, 220 400, 195" fill="#F2C94C" filter="drop-shadow(0px 0px 8px rgba(242, 201, 76, 0.8))" />

    <!-- 3. Left Infinity Loop (Cyan/Blue Ribbon) -->
    <!-- Swirl starts from center and loops left -->
    <path d="M 400, 310 
             C 310, 220 180, 250 180, 350 
             C 180, 450 310, 480 400, 390 
             C 440, 350 470, 310 520, 290" 
          fill="none" stroke="url(#infLeftGrad)" stroke-width="36" stroke-linecap="round" />
    
    <!-- Decorative tech circuit lines / floating pixel squares on left loop -->
    <rect x="135" y="320" width="12" height="12" fill="#00C9FF" opacity="0.8" />
    <rect x="155" y="295" width="8" height="8" fill="#00C9FF" opacity="0.6" />
    <rect x="175" y="280" width="10" height="10" fill="#4364F7" opacity="0.7" />
    <rect x="145" y="350" width="14" height="14" fill="#0052D4" opacity="0.9" />
    <circle cx="215" cy="395" r="5" fill="#FFFFFF" />
    <circle cx="245" cy="425" r="4" fill="#00C9FF" />
    
    <!-- 4. Right Infinity Loop (Green Ribbon curving to Arrow) -->
    <path d="M 370, 395 
             C 430, 455 560, 450 560, 350 
             C 560, 250 460, 240 400, 310" 
          fill="none" stroke="url(#infRightGrad)" stroke-width="36" stroke-linecap="round" />
    
    <!-- Arrow tip on green loop -->
    <!-- Points upwards-right -->
    <path d="M 525, 230 L 610, 230 L 590, 310 Z" fill="#84CC16" />

    <!-- 5. Growing bars (inside right loop) -->
    <rect x="450" y="380" width="16" height="40" rx="3" fill="#10B981" />
    <rect x="478" y="355" width="16" height="65" rx="3" fill="#10B981" />
    <rect x="506" y="330" width="16" height="90" rx="3" fill="#10B981" />
  </g>

  <!-- Typography Group -->
  <!-- "ASCORIX" text using custom vector letter paths for futuristic tech styling -->
  <g id="ascorix-text" transform="translate(0, 520)">
    <!-- A: chevron shape (Λ) -->
    <path d="M 85, 80 L 125, 20 L 165, 80" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- S -->
    <path d="M 235, 25 C 205, 20 195, 35 195, 45 C 195, 65 225, 60 225, 75 C 225, 85 205, 90 190, 80" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- C -->
    <path d="M 295, 25 C 270, 20 250, 38 250, 50 C 250, 62 270, 80 295, 75" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- O -->
    <rect x="315" y="22" width="55" height="56" rx="18" stroke="#FFFFFF" stroke-width="14" fill="none" />
    <!-- R -->
    <path d="M 390, 80 L 390, 20 L 425, 20 C 445, 20 445, 50 425, 50 L 390, 50 M 420, 50 L 445, 80" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- I -->
    <line x1="475" y1="20" x2="475" y2="80" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
    <!-- X: gradient stroke -->
    <path d="M 505, 20 L 555, 80 M 555, 20 L 505, 80" stroke="url(#ascorixXGrad)" stroke-width="18" stroke-linecap="round" />
  </g>

  <!-- "TECH SOLUTIONS" subtext -->
  <text x="320" y="680" font-family="'Outfit', 'Inter', sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="18" text-anchor="middle">TECH SOLUTIONS</text>
  
  <!-- Colored Divider Lines -->
  <line x1="70" y1="720" x2="270" y2="720" stroke="#00C9FF" stroke-width="3" />
  <line x1="370" y1="720" x2="570" y2="720" stroke="#10B981" stroke-width="3" />

  <!-- Slogan -->
  <text x="320" y="770" font-family="'Inter', sans-serif" font-size="22" font-weight="600" letter-spacing="4" text-anchor="middle">
    <tspan fill="#00C9FF">STRENGTHENING CORES.</tspan> 
    <tspan fill="#10B981"> ELEVATING FUTURES.</tspan>
  </text>
</svg>
